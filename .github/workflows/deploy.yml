name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
      - claude/frontend-lib-demo-3z4888
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Never run two deploys at once; always let the newest push win.
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Runs everywhere: a branch that fails the checks never reaches deploy.
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check the site is well-formed
        run: node scripts/check.mjs

      - uses: actions/configure-pages@v5

      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

  # Publishing runs on the default branch only. The `github-pages`
  # environment rejects deployments from other refs, so gating here keeps
  # branch and pull-request runs green instead of failing at the last step.
  deploy:
    needs: build
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
