name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
      - claude/frontend-lib-demo-3z4888
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Never run two deploys at once; always let the newest push win.
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Runs everywhere: a branch that fails the checks never reaches deploy.
  build:
    runs-on: ubuntu-latest
    outputs:
      pages_via_actions: ${{ steps.pages_source.outputs.actions }}
    steps:
      - uses: actions/checkout@v4

      - name: Check the site is well-formed
        run: node scripts/check.mjs

      - name: Check the README tables match the registry
        run: node scripts/readme.mjs --check

      # Pages can publish either from a branch or from a workflow. Deploying
      # through Actions only works in the second mode, so ask which is set
      # rather than failing at the last step.
      - name: Detect the Pages source
        id: pages_source
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          build_type=$(gh api "repos/${{ github.repository }}/pages" --jq '.build_type' 2>/dev/null || echo "none")
          echo "Pages build_type: $build_type"
          if [ "$build_type" = "workflow" ]; then
            echo "actions=true" >> "$GITHUB_OUTPUT"
          else
            echo "actions=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Pages is not set to build from GitHub Actions (build_type=$build_type). \
            Skipping the deploy job. Set Settings → Pages → Source → GitHub Actions to publish from here."
          fi

      - uses: actions/configure-pages@v5
        continue-on-error: true

      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

  # Publishing runs on the default branch only, and only when Pages is
  # actually configured to build from a workflow.
  deploy:
    needs: build
    if: >-
      github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
      && needs.build.outputs.pages_via_actions == 'true'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
